<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTESTACK - Student Notes Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar" aria-label="Navigation Sidebar">
            <div>
                <h2>📝 NoteStack</h2>
                <ul role="menu">
                    <li class="active" id="navNotes" role="menuitem" tabindex="0">📝 All Notes</li>
                    <li id="navImportant" role="menuitem" tabindex="0">🔴 Important</li>
                    <li id="navWork" role="menuitem" tabindex="0">🟡 Work</li>
                    <li id="navPersonal" role="menuitem" tabindex="0">🔵 Personal</li>
                    <li id="navIdeas" role="menuitem" tabindex="0">🟢 Ideas</li>
                    <li id="navTrash" role="menuitem" tabindex="0">🗑️ Trash</li>
                </ul>
                <div class="custom-folders-section">
                    <ul id="customFoldersList">
                        <!-- Dynamic folders will be injected here -->
                    </ul>
                    <button id="newFolderBtn" class="sidebar-btn" type="button">➕ New Folder</button>
                </div>
            </div>
            <div class="sidebar-actions">
                <button id="exportSidebarBtn" class="sidebar-btn export-sidebar-btn" type="button" aria-label="Export notes to text file" title="Export notes to a readable .txt file (Alt + E)">📥 Export (.txt)</button>
                <button id="darkModeBtn" type="button" aria-label="Toggle dark mode">🌙 Dark Mode</button>
            </div>
        </aside>

        <!-- Main Section -->
        <main class="main" role="main">

            <header class="topbar">
                <input type="text" id="searchInput" placeholder="Search notes by title..." aria-label="Search notes by title">
                <label for="subjectFilterSelect" class="sr-only">Filter by subject</label>
                <select id="subjectFilterSelect" class="subject-filter-select" aria-label="Filter by subject" title="Filter notes by subject">
                    <option value="all">All subjects</option>
                </select>
                <button id="exportAllBtn" class="export-all-btn" type="button" aria-label="Export all notes to text file" title="Export notes to a readable .txt file (Alt + E)">📥 Export to .txt</button>
            </header>

            <!-- NOTES VIEW -->
            <div id="notesView">
                <section class="create-note" aria-label="Create new note">
                    <div id="noteValidationMsg" class="validation-msg" style="display:none;" role="alert"></div>
                    <input type="text" id="noteTitleInput" placeholder="Note Title (required)" class="note-title-input" aria-label="Note Title">
                    <input type="text" id="noteSubjectInput" placeholder="Subject (e.g., Mathematics, CS, DBMS)" class="note-subject-input" aria-label="Note Subject">
                    <textarea id="noteInput" placeholder="Take a note... (required)" aria-label="Note Content"></textarea>
                    
                    <!-- Color Labels Section -->
                    <div class="label-selector">
                        <span class="label-title">Labels:</span>
                        <div class="label-options">
                            <label class="label-option">
                                <input type="checkbox" class="label-checkbox" value="Important">
                                <span class="label-dot important"></span> Important
                            </label>
                            <label class="label-option">
                                <input type="checkbox" class="label-checkbox" value="Work">
                                <span class="label-dot work"></span> Work
                            </label>
                            <label class="label-option">
                                <input type="checkbox" class="label-checkbox" value="Personal">
                                <span class="label-dot personal"></span> Personal
                            </label>
                            <label class="label-option">
                                <input type="checkbox" class="label-checkbox" value="Ideas">
                                <span class="label-dot ideas"></span> Ideas
                            </label>
                        </div>
                    </div>
                    <!-- Folder Selection -->
                    <div class="folder-selector">
                        <select id="folderSelect" aria-label="Select Folder">
                            <option value="">No Folder</option>
                            <!-- Dynamic folders injected here -->
                        </select>
                    </div>
                    <button id="addNoteBtn" type="button">Add Note</button>
                </section>
                <section id="notesGrid" class="notes-grid" aria-label="Notes Grid"></section>
            </div>

            <!-- TRASH VIEW (hidden by default) -->
            <div id="trashView" style="display:none;">
                <section id="trashGrid" class="notes-grid" aria-label="Trash Grid"></section>
            </div>

        </main>

    </div>

    <!-- Edit Note Modal -->
    <div id="editNoteModal" class="modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="editModalHeading">
        <div class="modal-content edit-modal-content">
            <span class="close-button" id="closeEditModal" aria-label="Close edit modal">&times;</span>
            <h2 id="editModalHeading">Edit Note</h2>
            <div id="editValidationMsg" class="validation-msg" style="display:none;" role="alert"></div>
            <input type="hidden" id="editNoteId">
            <label for="editNoteTitle" class="modal-label">Title</label>
            <input type="text" id="editNoteTitle" placeholder="Note Title (required)">
            <label for="editNoteSubject" class="modal-label">Subject</label>
            <input type="text" id="editNoteSubject" placeholder="Subject (e.g., Mathematics, CS, DBMS)">
            <label for="editNoteContent" class="modal-label">Content</label>
            <textarea id="editNoteContent" placeholder="Note Content (required)" rows="5"></textarea>
            <div class="modal-actions">
                <button id="cancelEditBtn" class="cancel-btn" type="button">Cancel</button>
                <button id="saveEditBtn" class="save-btn" type="button">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="deleteModalHeading">
        <div class="modal-content">
            <span class="close-button" id="closeDeleteModal" aria-label="Close delete modal">&times;</span>
            <h2 id="deleteModalHeading">Move to Trash?</h2>
            <p id="deleteConfirmText" class="modal-desc">Are you sure you want to move this note to trash?</p>
            <div class="modal-actions">
                <button id="cancelDeleteBtn" class="cancel-btn" type="button">Cancel</button>
                <button id="confirmDeleteBtn" class="delete-btn" type="button">Move to Trash</button>
            </div>
        </div>
    </div>

    <!-- New Folder Modal -->
    <div id="newFolderModal" class="modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="newFolderHeading">
        <div class="modal-content">
            <span class="close-button" id="closeFolderModal" aria-label="Close folder modal">&times;</span>
            <h2 id="newFolderHeading">Create Folder</h2>
            <input type="text" id="folderNameInput" placeholder="Folder Name (e.g., College, Work)">
            <button id="createFolderBtn" type="button">Create</button>
        </div>
    </div>

    <!-- Toast Notification for Action Feedback -->
    <div id="toastNotification" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>

</html>
